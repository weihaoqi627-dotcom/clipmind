name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 前端：检查 Vite 构建 ──
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build:renderer

  # ── Python：检查所有第三方包能正常导入 ──
  python-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装后端依赖
        run: pip install -r backend/requirements.txt
      - name: 安装额外包（RPC + Director）
        run: |
          pip install openai dashscope Pillow numpy opencv-python-headless \
            requests curl_cffi uniface 'cryptography>=48.0.0'
      - name: 验证所有导入
        run: python scripts/validate-imports.py
