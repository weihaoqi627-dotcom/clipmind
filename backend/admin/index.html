<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipMind 管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B0B0E;color:#E4E4E7;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;padding:24px}
h1{font-size:18px;font-weight:600;margin-bottom:24px;color:#FAFAFA}
h2{font-size:14px;font-weight:500;margin:24px 0 12px;color:#A1A1AA}
.card{background:#131316;border:1px solid #27272A;border-radius:8px;padding:16px;margin-bottom:16px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat-box{background:#1A1A1F;border-radius:6px;padding:12px}
.stat-label{color:#A1A1AA;font-size:11px}
.stat-value{font-size:20px;font-weight:600;color:#FAFAFA;margin-top:4px}
input,select{padding:6px 10px;border-radius:6px;border:1px solid #27272A;background:#1A1A1F;color:#E4E4E7;font-size:13px;outline:none}
input:focus{border-color:#52525B}
button{padding:6px 14px;border-radius:6px;border:none;font-size:13px;cursor:pointer}
.btn-primary{background:#7C3AED;color:#fff}
.btn-primary:hover{background:#6D28D9}
.btn-danger{background:#DC2626;color:#fff}
.btn-sm{padding:4px 10px;font-size:11px}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:#A1A1AA;font-weight:500;font-size:11px;padding:8px 6px;border-bottom:1px solid #27272A}
td{padding:8px 6px;border-bottom:1px solid #1A1A1F;font-size:12px}
tr:hover td{background:#1A1A1F}
.badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:500}
.badge-active{background:#166534;color:#86EFAC}
.badge-disabled{background:#7F1D1D;color:#FCA5A5}
.badge-free{background:#1E3A5F;color:#93C5FD}
.badge-premium{background:#5B21B6;color:#C4B5FD}
.pagination{display:flex;gap:8px;align-items:center;margin-top:12px}
.pagination button{padding:4px 10px;background:#27272A;color:#E4E4E7}
.pagination button:disabled{opacity:0.4}
.tab-bar{display:flex;gap:0;margin-bottom:16px;background:#131316;border-radius:8px;overflow:hidden}
.tab-btn{padding:8px 20px;border:none;background:transparent;color:#A1A1AA;cursor:pointer;font-size:13px}
.tab-btn.active{background:#1A1A1F;color:#FAFAFA;font-weight:500}
.tab-content{display:none}
.tab-content.active{display:block}
.login-box{max-width:360px;margin:120px auto;text-align:center}
.login-box h1{margin-bottom:24px}
.login-box input{width:100%;margin-bottom:12px}
.login-box button{width:100%;padding:10px}
.toast{position:fixed;bottom:24px;right:24px;background:#1A1A1F;border:1px solid #27272A;padding:10px 16px;border-radius:6px;font-size:12px;z-index:100;display:none}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:50}
.modal-box{background:#131316;border:1px solid #27272A;border-radius:8px;padding:20px;min-width:360px}
.modal-box h3{margin-bottom:12px}
.modal-box input{width:100%;margin:8px 0}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
</style>
</head>
<body>

<div id="login" class="login-box">
  <h1>ClipMind 管理后台</h1>
  <input type="text" id="adminUser" placeholder="用户名" value="admin">
  <input type="password" id="adminPass" placeholder="密码">
  <button class="btn-primary" onclick="login()">登录</button>
</div>

<div id="app" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h1>ClipMind 管理后台</h1>
    <button class="btn-sm btn-danger" onclick="logout()">退出</button>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('overview',this)">总览</button>
    <button class="tab-btn" onclick="switchTab('users',this)">用户管理</button>
    <button class="tab-btn" onclick="switchTab('usage',this)">用量报表</button>
    <button class="tab-btn" onclick="switchTab('orders',this);loadOrders()">订单管理</button>
  </div>

  <!-- 总览 -->
  <div id="tab-overview" class="tab-content active">
    <div class="stat-grid" id="statsGrid"></div>
  </div>

  <!-- 用户管理 -->
  <div id="tab-users" class="tab-content">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input type="text" id="searchUser" placeholder="搜索邮箱..." oninput="loadUsers()">
    </div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table>
        <thead><tr>
          <th>邮箱</th>
          <th>状态</th>
          <th>会员</th>
          <th>免费额度</th>
          <th>预付费</th>
          <th>并发</th>
          <th>注册时间</th>
          <th>操作</th>
        </tr></thead>
        <tbody id="userTableBody"></tbody>
      </table>
    </div>
    <div class="pagination" id="userPagination"></div>
  </div>

  <!-- 用量报表 -->
  <div id="tab-usage" class="tab-content">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <select id="reportDays" onchange="loadUsageReport()">
        <option value="7">近7天</option>
        <option value="30">近30天</option>
        <option value="90">近90天</option>
      </select>
    </div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table>
        <thead><tr><th>日期</th><th>模型</th><th>Token消耗</th><th>费用(元)</th></tr></thead>
        <tbody id="usageTableBody"></tbody>
      </table>
    </div>
    <h2>用户消耗排行</h2>
    <div class="card" style="padding:0;overflow-x:auto">
      <table>
        <thead><tr><th>排名</th><th>邮箱</th><th>消耗(Token)</th></tr></thead>
        <tbody id="topUsersBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 订单管理 -->
  <div id="tab-orders" class="tab-content">
    <div class="card" style="padding:0;overflow-x:auto">
      <table>
        <thead><tr><th>订单号</th><th>用户ID</th><th>金额(元)</th><th>Token</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
        <tbody id="ordersTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = window.location.origin;
let authHeader = '';
let currentPage = 1;

function login(){
  const u=document.getElementById('adminUser').value;
  const p=document.getElementById('adminPass').value;
  if(!u||!p) return;
  authHeader = btoa(u+':'+p);
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  loadStats();
  loadUsers();
  loadUsageReport();
}

function logout(){
  authHeader='';
  document.getElementById('login').style.display='block';
  document.getElementById('app').style.display='none';
}

async function api(path, opts={}){
  const resp = await fetch(API+path, {
    headers: {'X-Admin-Auth': authHeader, ...opts.headers},
    ...opts,
  });
  if(resp.status===401){
    alert('认证失效，请重新登录');
    logout();
    return null;
  }
  return resp.json();
}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.style.display='block';
  setTimeout(()=>el.style.display='none',2000);
}

function switchTab(name,btn){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
}

// ── 总览 ──
async function loadStats(){
  const data = await api('/api/admin/stats');
  if(!data) return;
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = `
    <div class="stat-box"><div class="stat-label">总用户数</div><div class="stat-value">${data.total_users}</div></div>
    <div class="stat-box"><div class="stat-label">活跃用户</div><div class="stat-value">${data.active_users}</div></div>
    <div class="stat-box"><div class="stat-label">会员用户</div><div class="stat-value">${data.premium_users}</div></div>
    <div class="stat-box"><div class="stat-label">月Token消耗</div><div class="stat-value">${(data.monthly_tokens_consumed/10000).toFixed(0)}万</div></div>
    <div class="stat-box"><div class="stat-label">总收入</div><div class="stat-value">¥${data.total_revenue_yuan.toFixed(2)}</div></div>
  `;
}

// ── 用户管理 ──
async function loadUsers(){
  const search=document.getElementById('searchUser').value;
  const data=await api(`/api/admin/users?page=${currentPage}&size=50`);
  if(!data) return;
  const tbody=document.getElementById('userTableBody');
  tbody.innerHTML=data.users.map(u=>`
    <tr>
      <td>${u.email}${u.display_name?' ('+u.display_name+')':''}</td>
      <td><span class="badge ${u.status==='active'?'badge-active':'badge-disabled'}">${u.status==='active'?'正常':'禁用'}</span></td>
      <td><span class="badge ${u.membership==='premium'?'badge-premium':'badge-free'}">${u.membership==='premium'?'会员':'免费'}</span></td>
      <td>${(u.free_tier_remaining/10000).toFixed(0)}万</td>
      <td>${(u.prepaid_tokens/10000).toFixed(2)}万</td>
      <td>${u.concurrency_limit}</td>
      <td>${new Date(u.created_at).toLocaleDateString()}</td>
      <td style="white-space:nowrap">
        <button class="btn-sm btn-primary" onclick="openAdjust('${u.id}','${u.email}')">调额度</button>
        <button class="btn-sm" style="background:#27272A" onclick="toggleUser('${u.id}')">${u.status==='active'?'禁用':'启用'}</button>
        ${u.membership!=='premium'?`<button class="btn-sm" style="background:#5B21B6;color:#fff" onclick="upgradeUser('${u.id}')">升会员</button>`:''}
      </td>
    </tr>
  `).join('');
}

function openAdjust(userId,email){
  document.getElementById('modalTitle').textContent='调整额度 - '+email;
  document.getElementById('modalBody').innerHTML=`
    <label style="color:#A1A1AA;font-size:11px">Token数量（正=增加，负=扣减）</label>
    <input type="number" id="adjTokens" value="0" style="margin-top:4px">
    <label style="color:#A1A1AA;font-size:11px;display:block;margin-top:8px">原因</label>
    <input type="text" id="adjReason" placeholder="例如：用户充值500万token" style="margin-top:4px">
  `;
  document.getElementById('modalActions').innerHTML=`
    <button onclick="closeModal()" style="background:#27272A;color:#E4E4E7">取消</button>
    <button class="btn-primary" onclick="adjustTokens('${userId}')">确认</button>
  `;
  document.getElementById('modal').style.display='flex';
}

function closeModal(){
  document.getElementById('modal').style.display='none';
}

async function adjustTokens(userId){
  const tokens=parseInt(document.getElementById('adjTokens').value);
  const reason=document.getElementById('adjReason').value;
  if(!tokens) return;
  await api('/api/admin/users/'+userId+'/adjust',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({tokens,reason}),
  });
  closeModal();
  toast('额度已调整');
  loadUsers();
}

async function toggleUser(userId){
  await api('/api/admin/users/'+userId+'/toggle',{method:'POST'});
  toast('状态已变更');
  loadUsers();
}

async function upgradeUser(userId){
  if(!confirm('确认升级该用户为会员？')) return;
  await api('/api/admin/users/'+userId+'/upgrade',{method:'POST'});
  toast('已升级为会员');
  loadUsers();
}

// ── 用量报表 ──
async function loadUsageReport(){
  const days=document.getElementById('reportDays').value;
  const data=await api(`/api/admin/usage/report?days=${days}`);
  if(!data) return;

  const tbody=document.getElementById('usageTableBody');
  tbody.innerHTML=data.daily.length
    ? data.daily.map(r=>`<tr><td>${r.day}</td><td>${r.model}</td><td>${Number(r.tokens).toLocaleString()}</td><td>¥${r.cost_yuan.toFixed(4)}</td></tr>`).join('')
    : '<tr><td colspan="4" style="color:#71717A;text-align:center">暂无数据</td></tr>';

  const topBody=document.getElementById('topUsersBody');
  topBody.innerHTML=data.top_users.length
    ? data.top_users.map((r,i)=>`<tr><td>${i+1}</td><td>${r.email||r.name||r.user_id}</td><td>${Number(r.tokens).toLocaleString()}</td></tr>`).join('')
    : '<tr><td colspan="3" style="color:#71717A;text-align:center">暂无数据</td></tr>';
}

// ── 订单管理 ──
async function loadOrders(){
  const data=await api('/api/admin/orders');
  if(!data) return;
  const tbody=document.getElementById('ordersTableBody');
  tbody.innerHTML=data.length
    ? data.map(o=>`
      <tr>
        <td style="font-family:monospace;font-size:11px">${o.order_id}</td>
        <td style="font-family:monospace;font-size:11px">${o.user_id}</td>
        <td>¥${o.amount_yuan.toFixed(2)}</td>
        <td>${Number(o.tokens_granted).toLocaleString()}</td>
        <td><span class="badge ${o.status==='paid'?'badge-active':'badge-disabled'}">${o.status==='paid'?'已到账':'待确认'}</span></td>
        <td>${new Date(o.created_at).toLocaleString()}</td>
        <td>${o.status==='pending'
          ? `<button class="btn-sm btn-primary" onclick="confirmOrder('${o.order_id}')">确认到账</button>`
          : '<span style="color:#71717A;font-size:11px">已完成</span>'}
        </td>
      </tr>
    `).join('')
    : '<tr><td colspan="7" style="color:#71717A;text-align:center">暂无订单</td></tr>';
}

async function confirmOrder(orderId){
  if(!confirm('确认该订单已收款？')) return;
  await api('/api/admin/orders/'+orderId+'/confirm',{method:'POST'});
  toast('已到账！');
  loadOrders();
}
</script>
</body>
</html>
